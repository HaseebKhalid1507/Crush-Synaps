[package]
name = "crush-eval-driver"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs crush-core in-process over a JSONL corpus (eval harness only)."

[dependencies]
crush-core = { path = "../../crates/crush-core" }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
