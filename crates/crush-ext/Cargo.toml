[package]
name = "crush-ext"
description = "Synaps process-extension shim (after_tool_call JSON-RPC) over crush-core: raw store, spill-aware replacement, /crush report."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "crush_ext"
path = "src/lib.rs"

[[bin]]
name = "crush-ext"
path = "src/main.rs"

[dependencies]
crush-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memchr = { workspace = true }

[dev-dependencies]
tempfile = "3"
