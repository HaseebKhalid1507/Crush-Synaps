[package]
name = "crush-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.crush-core]
path = "../crates/crush-core"

[[bin]]
name = "compress"
path = "fuzz_targets/compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shell"
path = "fuzz_targets/shell.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search"
path = "fuzz_targets/search.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search_elide"
path = "fuzz_targets/search_elide.rs"
test = false
doc = false
bench = false

[[bin]]
name = "listing"
path = "fuzz_targets/listing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log"
path = "fuzz_targets/log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[dependencies.crush-ext]
path = "../crates/crush-ext"

[dependencies.serde_json]
version = "1"

[[bin]]
name = "shim"
path = "fuzz_targets/shim.rs"
test = false
doc = false
bench = false
